services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supbro_e2e
      POSTGRES_USER: supbro
      POSTGRES_PASSWORD: local-e2e-only
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U supbro -d supbro_e2e" ]
      interval: 5s
      timeout: 5s
      retries: 10
